seed: 42
device: cuda

data:
  batch_size: 8
  num_workers: 0
  pin_memory: true

feature:
  # Python 0-based 索引
  layer_indices: [5, 6]
  pooling: mean

model:
  hidden_dim: 256
  dropout: 0.2

optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001

training:
  max_epochs: 50
  early_stopping_patience: 10