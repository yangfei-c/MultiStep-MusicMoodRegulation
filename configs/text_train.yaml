seed: 42
device: cuda

data:
  batch_size: 16
  max_length: 128
  num_workers: 4
  pin_memory: true

model:
  pretrained_name: xlm-roberta-base
  hidden_dim: 256
  dropout: 0.2
  trainable_encoder_layers: 4
  local_files_only: true

loss:
  name: smooth_l1_ccc
  beta: 0.1
  ccc_weight: 0.1

optimizer:
  name: adamw
  encoder_learning_rate: 0.00001
  head_learning_rate: 0.0001
  weight_decay: 0.01

scheduler:
  name: warmup_cosine
  warmup_ratio: 0.1
  min_learning_rate: 0.0000001

training:
  max_epochs: 15
  early_stopping_patience: 4
  early_stopping_min_delta: 0.0005
  amp: true
  gradient_clip_norm: 1.0
  max_consecutive_amp_skips: 8
