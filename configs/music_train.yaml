seed: 42
device: cuda

data:
  batch_size: 8
  tag_subset_batch_size: 64
  va_batch_size: 32
  num_workers: 4
  pin_memory: true

feature:
  layer_indices: [5, 6]
  pooling: mean_std

model:
  hidden_dim: 256
  dropout: 0.2
  pooling_eps: 1.0e-5

loss:
  tag:
    name: asymmetric_loss
    gamma_pos: 0.0
    gamma_neg: 4.0
    clip: 0.05
    eps: 1.0e-8
  tag_subset:
    name: positive_weighted_bce
    max_pos_weight: 20.0
  va:
    name: smooth_l1_ccc
    beta: 0.1
    ccc_weight: 0.1

optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001

scheduler:
  name: warmup_cosine
  warmup_ratio: 0.05
  min_learning_rate: 0.000001

training:
  max_epochs: 30
  early_stopping_patience: 8
  early_stopping_min_delta: 0.0005
  amp: true
  gradient_clip_norm: 1.0
  max_consecutive_amp_skips: 8
